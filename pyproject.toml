[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrailed-agentic-rag-iot"
version = "1.1.0"
description = "Reproducible confidence-aware Agentic RAG experiments for bounded IoT intrusion-mitigation planning"
requires-python = ">=3.12"
dependencies = [
  "joblib==1.5.3",
  "jsonschema==4.26.0",
  "matplotlib==3.11.1",
  "numpy==2.5.2",
  "openai==3.3.1",
  "pandas==3.0.5",
  "pypdf==6.16.1",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
docs = ["reportlab==4.4.9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
